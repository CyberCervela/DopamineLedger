# project.yml — xcodegen manifest for Dopamine Ledger round 2.
#
# Round 1 hand-rolled project.pbxproj with a UUID convention; every
# new Swift file needed four manual edits across the pbxproj. Round 2
# uses xcodegen instead. This file is the source of truth.
#
# Usage:
#   brew install xcodegen        # one-time
#   xcodegen generate            # or: make generate
#
# After adding/removing/moving Swift files in DopamineLedger/, rerun
# `make generate` and commit both this file AND the regenerated
# project.pbxproj.

name: DopamineLedger
options:
  bundleIdPrefix: com.cibercervela
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  # All languages supported by the in-app language picker.
  # xcodegen uses this to generate the KNOWN_REGIONS build setting, which
  # tells Xcode to include each language's .lproj folder in the app bundle.
  knownRegions:
    - en
    - fr
    - de
    - es
    - zh-Hans
    - ja
    - ko

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""        # fill in once on your machine; do NOT commit a real team id to a public repo
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  DopamineLedger:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DopamineLedger
    resources:
      - path: DopamineLedger/Assets.xcassets
      - path: DopamineLedger/LaunchImage.png  # Direct bundle resource — asset catalog images
                                              # are unreliable in launch screen storyboards
      - path: DopamineLedger/Fonts            # Monogram.ttf, AbaddonBold.ttf live here
        optional: true                        # OK if you haven't dropped fonts in yet
    dependencies:
      - target: DopamineLedgerWidgets         # embeds the .appex inside the main .app
        embed: true
      - sdk: AppIntents.framework             # explicit link required for Siri phrase metadata extraction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cibercervela.DopamineLedger
        INFOPLIST_FILE: DopamineLedger/Info.plist
        TARGETED_DEVICE_FAMILY: "1"           # iPhone only (round 1 locked this)
        GENERATE_INFOPLIST_FILE: NO           # we supply our own Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  DopamineLedgerWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DopamineLedgerWidgets
      # SessionActivityAttributes is the shared data contract — compiled
      # into both the main app (via the DopamineLedger directory above)
      # and into the extension (via this explicit path).
      - path: DopamineLedger/SessionActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cibercervela.DopamineLedger.widgets
        INFOPLIST_FILE: DopamineLedgerWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.9"

  DopamineLedgerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DopamineLedgerTests
    dependencies:
      - target: DopamineLedger
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DopamineLedger.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DopamineLedger"
        GENERATE_INFOPLIST_FILE: YES   # unit-test bundles don't need a hand-written plist

  # QA screenshot harness (resubmission visual matrix). Lives in its own scheme
  # so `make test` stays fast — run explicitly via the DopamineLedgerUITests
  # scheme. Test-only bundle; never ships in the app archive.
  DopamineLedgerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DopamineLedgerUITests
    dependencies:
      - target: DopamineLedger
    settings:
      base:
        TEST_TARGET_NAME: DopamineLedger
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # Separate scheme for the QA screenshot harness so the main scheme's test
  # action (and `make test`) stays unit-tests-only and fast.
  DopamineLedgerUITests:
    build:
      targets:
        DopamineLedger: all
        DopamineLedgerUITests: [test]
    test:
      targets:
        - DopamineLedgerUITests

  DopamineLedger:
    build:
      targets:
        DopamineLedger: all
        DopamineLedgerTests: [test]
        DopamineLedgerWidgets: all
    test:
      targets:
        - DopamineLedgerTests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
